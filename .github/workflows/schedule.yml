name: Daily Auto Scrape

# 触发条件
on:
  # 1. 定时触发 (UTC 时间)
  # 北京时间 08:00 = UTC 00:00
  # 北京时间 20:00 = UTC 12:00
  schedule:
    - cron: '0 0,12 * * *'
  
  # 2. 允许手动点击按钮触发 (方便测试)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run script
      env:
        # 这里把我们在 Settings 里填的密码注入到环境变量中
        MY_GIT_TOKEN: ${{ secrets.MY_GIT_TOKEN }}
        MY_REPO: ${{ secrets.MY_REPO }}
      run: python main.py
